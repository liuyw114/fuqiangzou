<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理后台 - 扶墙走</title>
  <style>
    :root {
      --primary: #6C7AE0;
      --primary-dark: #4A54B0;
      --warm-bg: #F4F6FA;
      --warm-card: #FFFFFF;
      --text-main: #2E3A4D;
      --text-sub: #6B7B8E;
      --text-light: #A3B1BF;
      --radius: 16px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: var(--warm-bg);
      color: var(--text-main);
      line-height: 1.7;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: var(--warm-card);
      border-radius: var(--radius);
      padding: 40px 32px;
      box-shadow: 0 4px 24px rgba(108,122,224,0.10);
      max-width: 420px;
      width: 100%;
      text-align: center;
    }
    .card-icon { font-size: 56px; margin-bottom: 16px; }
    .card-title { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
    .card-sub { font-size: 13px; color: var(--text-light); margin-bottom: 28px; }
    .la-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 14px 32px;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      color: #fff;
      border-radius: 12px;
      text-decoration: none;
      font-size: 15px;
      font-weight: 600;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 4px 16px rgba(108,122,224,0.3);
    }
    .la-link:hover { transform: translateY(-2px); box-shadow: 0 6px 24px rgba(108,122,224,0.4); }
    .back-link {
      display: inline-block;
      margin-top: 20px;
      font-size: 13px;
      color: var(--text-sub);
      text-decoration: none;
      transition: color 0.2s;
    }
    .back-link:hover { color: var(--primary); }
  </style>
</head>
<body>
  <div class="card">
    <div class="card-icon">📊</div>
    <div class="card-title">扶墙走 · 管理后台</div>
    <div class="card-sub">用户访问数据与事件追踪统计</div>

  </div>
</body>
</html>
